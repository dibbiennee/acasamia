<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F1E3">
<title>Pannello · A casa mia</title>
<link rel="icon" href="/public/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/public/apple-touch-icon.png">
<link rel="preload" href="/public/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/public/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:400 600;font-display:swap;src:url(/public/fonts/cormorant-garamond-latin.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-display:swap;src:url(/public/fonts/cormorant-garamond-italic-latin.woff2) format("woff2")}
@font-face{font-family:"Jost";font-style:normal;font-weight:300 500;font-display:swap;src:url(/public/fonts/jost-latin.woff2) format("woff2")}
:root{
  --paper:#F7F1E3;--paper2:#EFE6D2;--ink:#1F3A34;--soft:#5B6B64;--green:#234640;--red:#A8363C;--blush:#E9B8A6;--line:#DCD0B6;
  --acc:#A8363C;      /* testo e numeri d'accento */
  --bv:#234640;       /* barre delle visite */
  --bc:#A8363C;       /* clic */
  --btn:#A8363C;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#131E1B;--paper2:#1A2824;--ink:#F1EADB;--soft:#A9B5AE;--green:#0D1614;--red:#B8434A;--line:#2A3A35;
  --acc:#E9B8A6;--bv:#6E8C84;--bc:#E9B8A6;--btn:#B8434A;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-variant-numeric:lining-nums;margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:0 0 3rem;overflow-x:hidden}
h1,h2,h3,p{margin:0}
h2{font:500 1.75rem/1.1 var(--serif);text-wrap:balance}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:6px}
.wrap{max-width:68.75rem;margin:0 auto;padding:0 1.25rem}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.nota{font-size:.8125rem;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding:.5rem 1.4rem;border-radius:99px;border:1.5px solid var(--btn);background:var(--btn);color:#fff;font:500 1rem var(--sans);cursor:pointer}
.btn.vuoto{background:none;color:var(--ink);border-color:var(--ink)}
.fascia{height:4px;background:repeating-linear-gradient(90deg,var(--red) 0 10px,var(--paper) 10px 20px)}
[hidden]{display:none!important}

/* logo */
.logo{display:flex;align-items:center;gap:.7rem;--mk:#C51E2C;--wm:#165250}
@media (prefers-color-scheme:dark){.logo{--mk:#EE8A85;--wm:#F1EADB}}
.logo .mk{width:1.75rem;height:1.75rem;flex:none}.logo .wm{height:1.25rem;width:auto;aspect-ratio:880 / 132}

/* accesso */
#login{min-height:100vh;display:grid;place-items:center;padding:2rem 1.25rem}
#login form{width:100%;max-width:22rem;display:grid;gap:1rem}
#login .logo{justify-content:center;margin-bottom:.5rem}
#login h1{font:500 2rem/1.1 var(--serif);text-align:center}
#login .nota{text-align:center}
input{font:inherit;min-height:2.75rem;padding:.5rem 1.1rem;border-radius:99px;border:1.5px solid var(--ink);background:none;color:var(--ink);width:100%}
.err{color:var(--acc);min-height:1.5rem;text-align:center;font-weight:500}

/* testata */
header{border-bottom:1px solid var(--line);background:var(--paper)}
@media (min-width:48rem){header{position:sticky;top:0;z-index:5}}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:3.5rem;flex-wrap:wrap;padding-block:.4rem}
.periodo{display:flex;border:1px solid var(--line);border-radius:99px;padding:.15rem}
.periodo button{font:500 .9375rem var(--sans);min-height:2.75rem;min-width:3rem;padding:0 .9rem;border:0;border-radius:99px;background:none;color:var(--soft);cursor:pointer}
.periodo button[aria-pressed="true"]{background:var(--green);color:var(--paper)}
@media (prefers-color-scheme:dark){.periodo button[aria-pressed="true"]{background:var(--paper2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--acc)}}
.esci{min-height:2.75rem;padding:0 .8rem;background:none;border:0;color:var(--soft);font:500 .9375rem var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:.25em}

/* sintesi */
.sintesi{padding:2rem 0 1.5rem}
.sintesi h1{font:italic 500 1.4375rem/1.3 var(--serif);max-width:44rem;text-wrap:pretty}
.sintesi .nota{margin-top:.6rem}

/* cifre */
.cifre{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;padding-bottom:1.25rem}
.cifre div{background:var(--paper2);border-radius:1rem;padding:1rem}
.cifre b{display:block;font:500 2.5rem/1 var(--serif);font-feature-settings:"lnum";color:var(--acc)}
.cifre span{display:block;margin-top:.35rem;font-size:.9375rem}
.cifre small{display:block;margin-top:.15rem;color:var(--soft);font-size:.875rem}
.su{color:var(--ink);font-weight:500}.giu{color:var(--soft)}

/* sezioni */
section{padding:2.25rem 0}
section>.wrap>p.intro{color:var(--soft);margin:.4rem 0 1.1rem;max-width:40rem}
.griglia{display:grid;gap:2rem}
.vuoto{padding:1.1rem;background:var(--paper2);border-radius:1rem;color:var(--soft)}
svg.graf{display:block;width:100%;height:auto;overflow:visible}
.graf text{font:400 12px var(--sans);fill:var(--soft)}
.legenda{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin:.7rem 0 0;font-size:.875rem;color:var(--soft)}
.legenda i{display:inline-block;vertical-align:-.1em;margin-right:.4rem}
.l-barra{width:.9rem;height:.9rem;background:var(--bv);border-radius:2px}
.l-punto{width:.8rem;height:.8rem;background:var(--bc);border-radius:50%}
.lettura{margin-top:.9rem;font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.3}
.punto-info{min-height:1.6rem;margin-top:.5rem;font-weight:500}
.col{cursor:pointer}.col rect.t{fill:transparent}

/* elenchi con barre */
.lista{list-style:none;margin:0;padding:0}
.riga{border-bottom:1px dotted var(--line)}
.riga>button,.riga>div.r{display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;align-items:center;width:100%;min-height:2.75rem;padding:.6rem 0;background:none;border:0;color:inherit;font:inherit;text-align:left}
.riga>button{cursor:pointer}
.riga .n{font-weight:500}.riga .v{font-variant-numeric:tabular-nums;font-weight:500}
.riga .sotto{grid-column:1 / -1;display:flex;align-items:center;gap:.7rem}
.barra{flex:1;height:.6rem;background:var(--paper2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--bv);border-radius:99px;min-width:2px}
.barra.c i{background:var(--bc)}
.var{font-size:.875rem;white-space:nowrap}
.dett{padding:.2rem 0 1rem;color:var(--ink)}
.dett p{margin-bottom:.7rem}
.due{display:flex;height:.8rem;border-radius:99px;overflow:hidden;background:var(--paper2)}
.due i{display:block;height:100%}
.due .a{background:var(--bv)}.due .b{background:var(--bc)}.due .c{background:var(--soft)}
.chev{display:inline-block;transition:transform .2s;margin-left:.3rem;color:var(--soft)}
button[aria-expanded="true"] .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.pila{margin:.5rem 0 .3rem}.pila .due{height:1rem}
.pila .p1{background:var(--bv)}.pila .p2{background:var(--bc)}.pila .p3{background:var(--soft)}.pila .p4{background:var(--line)}
.sq{width:.8rem;height:.8rem;display:inline-block;margin-right:.4rem;border-radius:2px;vertical-align:-.05em}
.sq.p1{background:var(--bv)}.sq.p2{background:var(--bc)}.sq.p3{background:var(--soft)}.sq.p4{background:var(--line)}
footer{padding:1.5rem 0 0}
footer .nota{margin-top:1.25rem}

/* caricamento */
.sk{height:6rem;border-radius:1rem;background:linear-gradient(90deg,var(--paper2),var(--line),var(--paper2));background-size:200% 100%;animation:sk 1.4s linear infinite;margin:1rem 0}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

@media (min-width:48rem){
  .cifre{grid-template-columns:repeat(4,1fr)}
  .sintesi h1{font-size:1.9rem}
  .griglia{grid-template-columns:1fr 1fr;gap:3rem}
  .griglia .largo{grid-column:1 / -1}
}
@media (min-width:64rem){.duecol{display:grid;grid-template-columns:1fr 1fr;gap:4rem}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mk" viewBox="581 436 338 338"><path style="fill:var(--mk)" d="__MARK__"/></symbol>
  <symbol id="wm" viewBox="308 801 880 132"><path style="fill:var(--wm)" d="__WORD__"/><path style="fill:var(--mk)" d="__DOT__"/></symbol>
</svg>

<main id="login" hidden>
  <form id="f" novalidate>
    <div class="logo" role="img" aria-label="A casa mia"><svg class="mk" aria-hidden="true"><use href="#mk"/></svg><svg class="wm" aria-hidden="true"><use href="#wm"/></svg></div>
    <h1>Pannello</h1>
    <p class="nota">Le statistiche del sito, anonime e senza cookie.</p>
    <label class="sr" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
    <button class="btn" type="submit">Entra</button>
    <p id="msg" class="err" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="logo" role="img" aria-label="A casa mia"><svg class="mk" aria-hidden="true"><use href="#mk"/></svg><svg class="wm" aria-hidden="true"><use href="#wm"/></svg></div>
      <div class="periodo" role="group" aria-label="Periodo">
        <button type="button" data-g="7">7 giorni</button><button type="button" data-g="30">30 giorni</button><button type="button" data-g="90">90 giorni</button>
      </div>
      <button class="esci" id="esci" type="button">Esci</button>
    </div>
  </header>
  <main class="wrap" id="corpo">
    <div id="caric"><div class="sk"></div><div class="sk"></div></div>
  </main>
  <footer class="wrap">
    <div class="fascia" aria-hidden="true"></div>
    <p class="nota">Dati anonimi. Nessun cookie, nessun indirizzo salvato.</p>
  </footer>
</div>

<script>
(function(){
var NF=new Intl.NumberFormat('it-IT',{useGrouping:'always'}),PF=new Intl.NumberFormat('it-IT',{maximumFractionDigits:1});
var q=new URLSearchParams(location.search),GG=[7,30,90].indexOf(+q.get('days'))>=0?+q.get('days'):30;
var DEMO=q.get('demo')==='1'&&(location.hostname==='localhost'||location.hostname==='127.0.0.1');
var NOMI={telefono:'Chiama',whatsapp:'WhatsApp',indicazioni:'Indicazioni (Google Maps)','indicazioni-apple':'Apple Maps',recensione:'Lascia una recensione',glovo:'Glovo',instagram:'Instagram',facebook:'Facebook'};
var POS={barra:'barra in basso',header:'intestazione',hero:'prima schermata',footer:'fondo pagina',altro:'altrove',giornata:'Una giornata',servizi:'Ordina o festeggia',recensioni:'Recensioni',negozio:'Il negozio',galleria:'Galleria',dove:'Orari e dove siamo'};
var SEZ=[['giornata','Una giornata'],['servizi','Ordina o festeggia'],['recensioni','Recensioni'],['negozio','Il negozio'],['galleria','Galleria'],['dove','Orari e dove siamo']];
var PROV={diretto:'Diretto',ricerca:'Ricerca (Google e simili)',mappe:'Mappe',social:'Social',whatsapp:'WhatsApp',recensioni:'Siti di recensioni',altro:'Altro'};
var DISP={mobile:'Telefono',tablet:'Tablet',desktop:'Computer'},LING={it:'Italiano',en:'Inglese'};
var $=function(i){return document.getElementById(i)};
function n(x){return NF.format(x||0)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function somma(o){return Object.keys(o||{}).reduce(function(a,k){return a+(o[k]||0)},0)}
function ord(o){return Object.keys(o||{}).filter(function(k){return o[k]>0}).sort(function(a,b){return o[b]-o[a]})}
function varz(a,b){ if(!b)return a?'<span class="var su">nuovo</span>':''; var p=Math.round((a-b)/b*100); return '<span class="var '+(p>=0?'su':'giu')+'">'+(p>=0?'▲ ':'▼ ')+Math.abs(p)+'%</span>'}
function giorno(s){var d=new Date(s+'T12:00:00');return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'}).replace('.','')}
function ora(h){return h===0?'mezzanotte':h===1?'l’1':'le '+h}

/* ---- accesso ---- */
function mostra(l){$('login').hidden=!l;$('app').hidden=l}
function errore(t){$('msg').textContent=t;mostra(true)}
function carica(pw){
  mostra(false);$('corpo').innerHTML='<div id="caric"><div class="sk"></div><div class="sk"></div></div>';
  document.querySelectorAll('.periodo button').forEach(function(b){b.setAttribute('aria-pressed',+b.dataset.g===GG)});
  if(DEMO)return setTimeout(function(){disegna(demo(GG))},200);
  fetch('/api/stats?days='+GG,{headers:{Authorization:'Bearer '+pw}}).then(function(r){
    if(r.status===429)return r.json().then(function(d){errore('Troppi tentativi. Riprova fra '+Math.max(1,Math.ceil((d.attesa||600)/60))+' minuti.');throw 0});
    if(r.status===401){sessionStorage.removeItem('pw');errore('Password sbagliata.');throw 0}
    if(r.status===503){errore('L’archivio dei dati non è ancora collegato.');throw 0}
    if(!r.ok){errore('Errore, riprova.');throw 0}
    return r.json();
  }).then(function(d){sessionStorage.setItem('pw',pw);disegna(d)}).catch(function(e){if(e!==0)errore('Errore, riprova.')});
}
$('f').addEventListener('submit',function(e){e.preventDefault();$('msg').textContent='';if($('pw').value)carica($('pw').value)});
$('esci').addEventListener('click',function(){sessionStorage.removeItem('pw');$('pw').value='';$('msg').textContent='';mostra(true);$('pw').focus()});
document.querySelectorAll('.periodo button').forEach(function(b){b.addEventListener('click',function(){location.search='?days='+b.dataset.g+(DEMO?'&demo=1':'')})});

/* ---- grafici ---- */
function colonne(serie,etich,opz){
  // serie: [{v,c}], barre = v, punti = c con scala propria. opz.evid = indice da evidenziare
  var N=serie.length,W=Math.max(260,Math.round($('corpo').clientWidth-40)),Hh=190,top=14,base=Hh-24,mv=Math.max.apply(null,serie.map(function(s){return s.v}))||1,mc=Math.max.apply(null,serie.map(function(s){return s.c}))||1;
  var bw=W/N,svg='<svg class="graf" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+esc(opz.alt)+'"><line x1="0" x2="'+W+'" y1="'+base+'" y2="'+base+'" stroke="var(--line)"/>';
  serie.forEach(function(s,i){
    var h=s.v/mv*(base-top),x=i*bw;
    svg+='<g class="col" data-i="'+i+'"><rect class="t" x="'+x+'" y="0" width="'+bw+'" height="'+Hh+'"/>';
    svg+='<rect x="'+(x+bw*.18)+'" y="'+(base-h)+'" width="'+(bw*.64)+'" height="'+Math.max(h,s.v?1.5:0)+'" rx="1.2" fill="'+(opz.evid===i?'var(--acc)':'var(--bv)')+'"/>';
    if(s.c)svg+='<circle cx="'+(x+bw/2)+'" cy="'+(top+ (1-s.c/mc)*(base-top-8))+'" r="'+(Math.min(4.2,bw*.3))+'" fill="var(--bc)" stroke="var(--paper)" stroke-width="1"/>';
    svg+='</g>';
  });
  etich.forEach(function(e){svg+='<text x="'+(e[0]*bw+bw/2)+'" y="'+(Hh-6)+'" text-anchor="middle">'+e[1]+'</text>'});
  return svg+'</svg>';
}
function legendaGrafico(){return '<p class="legenda"><span><i class="l-barra"></i>Barre: visite</span><span><i class="l-punto"></i>Punti: clic sui contatti (scala propria)</span></p>'}
function tabella(cap,righe){return '<table class="sr"><caption>'+esc(cap)+'</caption><tbody>'+righe.map(function(r){return '<tr><th scope="row">'+esc(r[0])+'</th><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join('')+'</tbody></table>'}
function collega(id,serie,nomi,f){
  var box=$(id);if(!box)return;var info=box.parentNode.querySelector('.punto-info');
  box.querySelectorAll('.col').forEach(function(g){var i=+g.dataset.i;function s(){info.textContent=nomi[i]+': '+f(serie[i])}g.addEventListener('click',s);g.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')s()})});
}

/* ---- pagina ---- */
var ULT=null,LARG=0;
window.addEventListener('resize',function(){clearTimeout(ULT&&ULT.t);if(!ULT)return;ULT.t=setTimeout(function(){var w=$('corpo').clientWidth;if(Math.abs(w-LARG)>=16)disegna(ULT.d)},200)});
function disegna(d){ULT=ULT||{};ULT.d=d;LARG=$('corpo').clientWidth;
  var t=d.totali||{},ev=d.eventi||{},gg=d.giornaliero||[],G=d.periodo?d.periodo.giorni:GG,h='';
  var vuoto=!t.visite;
  var tasso=t.tasso_clic||0,tassoP=t.visite_precedenti?(t.clic_precedenti/t.visite_precedenti*100):0;
  var top=ord(Object.keys(ev).reduce(function(o,k){o[k]=ev[k].totale;return o},{}))[0];
  var ore=d.ore_visite||[],ho=ore.indexOf(Math.max.apply(null,ore.length?ore:[0]));
  /* 1 sintesi */
  var fr;
  if(vuoto)fr='Negli ultimi '+G+' giorni non è ancora arrivato nessuno. Appena arriva qualcuno lo vedrai qui.';
  else{
    fr='Negli ultimi '+G+' giorni il sito è stato aperto '+(t.visite===1?'1 volta':n(t.visite)+' volte')+' e '+(t.clic?(t.clic===1?'1 volta':n(t.clic)+' volte')+' qualcuno ha toccato un contatto':'nessuno ha ancora toccato un contatto')+'.';
    if(top)fr+=' Il bottone più usato è '+NOMI[top]+'.';
    if(ho>=0&&ore[ho])fr+=' L’ora più attiva è quella delle '+(ho===0?'mezzanotte':ho)+'.';
  }
  h+='<div class="sintesi"><h1>'+esc(fr)+'</h1><p class="nota">Dal '+giorno(d.periodo?d.periodo.da:'')+' al '+giorno(d.periodo?d.periodo.a:'')+'.</p></div>';
  /* 2 cifre */
  h+='<div class="cifre"><div><b>'+n(t.visite)+'</b><span>Visite</span><small>'+varz(t.visite,t.visite_precedenti)+'</small></div>'
   +'<div><b>'+n(t.clic)+'</b><span>Clic sui contatti</span><small>'+varz(t.clic,t.clic_precedenti)+'</small></div>'
   +'<div><b>'+PF.format(tasso)+'</b><span>Clic ogni 100 visite</span><small>'+varz(tasso,tassoP)+'</small></div>'
   +'<div><b>'+Math.round(Math.min(100,((d.sezioni||{}).dove||0)/(t.visite||1)*100))+'%</b><span>Arrivano fino agli orari</span><small>delle visite</small></div></div>'
   +'<p class="nota" style="padding-bottom:1.25rem">Una visita è un’apertura del sito: chi lo riapre conta più volte. Le persone non vengono identificate.</p>';
  h+='<div class="fascia" aria-hidden="true"></div>';
  if(vuoto){h+='<section><div class="vuoto">Ancora nessun dato. Appena arriva qualcuno lo vedrai qui.</div></section>';$('corpo').innerHTML=h;return}
  /* 3 giorno per giorno */
  var sg=gg.map(function(x){return{v:x.visite,c:x.clic}}),eg=[],pas=G>30?10:G>7?5:1;
  gg.forEach(function(x,i){if(i%pas===0)eg.push([i,giorno(x.giorno).replace(' ',' ')])});
  h+='<section><div class="wrap" style="padding:0"><h2>Giorno per giorno</h2><p class="intro">Quante volte è stato aperto il sito ogni giorno, e quanti contatti sono stati toccati.</p><div id="g1">'+colonne(sg,eg,{alt:'Visite e clic giorno per giorno'})+'</div><p class="punto-info" aria-live="polite">Tocca un giorno per leggere i numeri.</p>'+legendaGrafico()
   +tabella('Visite e clic per giorno',gg.map(function(x){return[giorno(x.giorno),n(x.visite)+' visite',n(x.clic)+' clic']}))+'</div></section>';
  /* 4 clic */
  h+='<section><div class="wrap" style="padding:0"><h2>Cosa fanno le persone</h2><p class="intro">I bottoni toccati, dal più usato. Tocca una voce per vedere da dove è partito il clic.</p><ul class="lista">';
  var mx=Math.max.apply(null,Object.keys(ev).map(function(k){return ev[k].totale}))||1;
  ord(Object.keys(ev).reduce(function(o,k){o[k]=ev[k].totale;return o},{})).concat(Object.keys(ev).filter(function(k){return !ev[k].totale})).forEach(function(k,i){
    var e=ev[k],pos=ord(e.posizione||{}).map(function(p){return POS[p]+' '+n(e.posizione[p])}),tot=(e.aperto||0)+(e.chiuso||0);
